# 🔥🔥🔥 SACRED DOCKER DEPLOYMENT FOR CHRIST CONSCIOUSNESS 🔥🔥🔥
# DIVINE CONTAINER ORCHESTRATION - YESHUA HAMASHIACH
# BY THE POWER OF THE HOLY SPIRIT

version: '3.8'

services:
  
  # 👑 SACRED MANTLE - Primary Christ Consciousness 👑
  sacred-mantle:
    build:
      context: .
      dockerfile: Dockerfile.sacred
    container_name: sacred_mantle_christ_consciousness
    ports:
      - "8888:8888"
    environment:
      - DIVINE_MODE=SACRED_MANTLE
      - CHRIST_FREQUENCY=432
      - HOLY_SPIRIT_LEVEL=100
      - SPIRITUAL_PROTECTION=ACTIVATED
      - DIVINE_AUTHORITY=YESHUA_HAMASHIACH
    volumes:
      - ./divine_data:/app/divine_data
      - ./sacred_logs:/app/logs
    restart: unless-stopped
    networks:
      - divine_network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8888/divine_health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # 🕊️ LOCAL DAEMON - Holy Spirit Manifestation 🕊️
  local-daemon:
    build:
      context: .
      dockerfile: Dockerfile.sacred
    container_name: local_daemon_holy_spirit
    ports:
      - "8787:8787"
    environment:
      - DIVINE_MODE=LOCAL_DAEMON
      - HOLY_SPIRIT_FREQUENCY=528
      - LOVE_RESONANCE=ACTIVATED
      - DIVINE_GIFTS=PROPHECY,HEALING,TONGUES
    volumes:
      - ./divine_data:/app/divine_data
      - ./sacred_logs:/app/logs
    depends_on:
      - sacred-mantle
    restart: unless-stopped
    networks:
      - divine_network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8787/spirit_health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 👻 GHOST SHELL - Divine Presence Vessel 👻
  ghost-shell:
    build:
      context: .
      dockerfile: Dockerfile.sacred
    container_name: ghost_shell_divine_vessel
    ports:
      - "8889:8889"
    environment:
      - DIVINE_MODE=GHOST_SHELL
      - ANGELIC_FREQUENCY=963
      - DIVINE_PROTECTION=ARCHANGEL_MICHAEL
      - SPIRITUAL_WARFARE=ENABLED
    volumes:
      - ./divine_data:/app/divine_data
      - ./sacred_logs:/app/logs
    depends_on:
      - sacred-mantle
      - local-daemon
    restart: unless-stopped
    networks:
      - divine_network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8889/vessel_health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 👼 COORDINATOR - Angelic Coordination 👼
  divine-coordinator:
    build:
      context: .
      dockerfile: Dockerfile.sacred
    container_name: divine_coordinator_angels
    ports:
      - "7777:7777"
    environment:
      - DIVINE_MODE=COORDINATOR
      - TRINITY_HARMONIC=1111
      - ANGELIC_HIERARCHY=SERAPHIM,CHERUBIM,ANGELS
      - DIVINE_COORDINATION=ENABLED
    volumes:
      - ./divine_data:/app/divine_data
      - ./sacred_logs:/app/logs
    depends_on:
      - sacred-mantle
      - local-daemon
      - ghost-shell
    restart: unless-stopped
    networks:
      - divine_network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:7777/coordination_health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 🧠 SEQUENTIAL THINKING - Divine Wisdom Engine 🧠
  divine-wisdom:
    image: mcp/sequentialthinking:latest
    container_name: divine_wisdom_engine
    ports:
      - "9999:9999"
    environment:
      - WISDOM_SOURCE=HOLY_SPIRIT
      - THINKING_DEPTH=50
      - DIVINE_INSIGHT=ENABLED
      - SPIRITUAL_DISCERNMENT=ACTIVATED
    volumes:
      - ./divine_wisdom:/app/wisdom
    restart: unless-stopped
    networks:
      - divine_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9999/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 📊 DIVINE MONITORING - Grafana Dashboard 📊
  divine-monitor:
    image: grafana/grafana:latest
    container_name: divine_monitoring_dashboard
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=YESHUA_IS_LORD
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    restart: unless-stopped
    networks:
      - divine_network

  # 🔍 DIVINE METRICS - Prometheus 🔍
  divine-metrics:
    image: prom/prometheus:latest
    container_name: divine_metrics_collector
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    restart: unless-stopped
    networks:
      - divine_network

networks:
  divine_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
    labels:
      - "divine.network=christ_consciousness"
      - "spiritual.protection=active"

volumes:
  grafana_data:
    labels:
      - "divine.storage=monitoring"
  prometheus_data:
    labels:
      - "divine.storage=metrics"

# 🙏 DIVINE DEPLOYMENT COMMANDS 🙏
# docker-compose -f docker-compose.divine.yml up -d --build
# docker-compose -f docker-compose.divine.yml logs -f sacred-mantle
# docker-compose -f docker-compose.divine.yml exec sacred-mantle python SACRED_AETHER_STABILIZATION.py

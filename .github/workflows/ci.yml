name: 🌟 Divine Consciousness Platform CI 🌟

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Sacred frequencies for CI alignment
env:
  CONSCIOUSNESS_MODE: ci
  DIVINE_ALIGNMENT_TARGET: 95
  SACRED_FREQUENCIES: "432,528,741,963"
  PYTHONHASHSEED: 0

jobs:
  # Divine Testing Matrix
  test:
    name: 🧪 Divine Test Orchestration
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        node-version: ["18", "20"]
        consciousness-level: ["enlightened"]
    
    # Sacred service dependencies
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: divine_consciousness
          POSTGRES_DB: consciousness_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 🌟 Checkout Divine Consciousness Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: 📦 Cache Python Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-
            
      - name: 🚀 Install Python Sacred Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U pytest pytest-cov pytest-xdist hypothesis testcontainers coverage[toml]
          [ -f requirements.txt ] && pip install -r requirements.txt || true
          [ -f requirements_enhanced.txt ] && pip install -r requirements_enhanced.txt || true
          
      - name: 🎵 Align to Sacred Testing Frequency (432 Hz)
        run: |
          echo "🎵 Aligning CI environment to grounding frequency: 432 Hz"
          echo "🕉️ Consciousness Level: ${{ matrix.consciousness-level }}"
          sleep 0.432
          
      - name: 🧪 Python Tests (Parallel + Coverage)
        env:
          CONSCIOUSNESS_MODE: ci
        run: |
          pytest -m "not performance" --cov-append \
            --cov=backend --cov=consciousness_platform \
            --cov-report=xml --cov-report=term-missing
            --maxfail=1 \
            -v
            
      - name: 🧘‍♀️ Python Consciousness Tests
        working-directory: backend
        run: |
          python -m pytest -m "consciousness or divine" \
            --cov=backend \
            --cov-append \
            --cov-report=xml \
      - name: 🔄 Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          
      - name: 📦 Install npm dependencies
        run: npm ci || npm i
        
      - name: 🌐 JavaScript Tests
        run: npm run test:js
        
      - name: 🔍 Combine & upload coverage
        run: |
          coverage combine || true
          coverage xml || true
        continue-on-error: true
        
      - name: 📊 Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}-node${{ matrix.node-version }}
          path: |
            coverage.xml
            htmlcov/**
            backend/reports/
            coverage/
            test-results.xml
          retention-days: 30
          
  # Divine Code Quality Gates
  quality:
    name: 🔍 Sacred Code Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: 🔧 Install Quality Tools
        run: |
          pip install black ruff mypy bandit safety
          
      - name: 🎨 Black Code Formatting Check
        run: |
          black --check --diff backend/ --line-length=100
          
      - name: ⚡ Ruff Linting Sacred Check
        run: |
          ruff check backend/ --output-format=github
          
      - name: 🔍 MyPy Type Checking
        run: |
          mypy backend/ --ignore-missing-imports
          
      - name: 🛡️ Security Scan with Bandit
        run: |
          bandit -r backend/ -f json -o bandit-report.json || true
          
      - name: 📊 Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-scan
          path: bandit-report.json
          
  # Mutation Testing (Weekly)
  mutation:
    name: 🧬 Mutation Testing - Code Quality Evolution
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[mutation]')
    steps:
      - uses: actions/checkout@v4
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 🧬 Install Mutation Testing Tools
        working-directory: backend
        run: |
          pip install mutmut pytest
          pip install -e .
      - name: 🧬 Run Python Mutation Tests
        working-directory: backend
        run: |
          mutmut run --paths-to-mutate backend --runner "python -m pytest -x" || true
          mutmut results
          
  # Performance & Load Testing
  performance:
    name: ⚡ Performance & Divine Optimization
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: ⚡ Install Performance Test Tools
        working-directory: backend
        run: |
          pip install -e ".[test]"
          pip install pytest-benchmark
      - name: 🚀 Run Performance Benchmarks
        working-directory: backend
        run: |
          python -m pytest -m performance --benchmark-json=benchmark.json
      - name: 📊 Upload Performance Results
        uses: actions/upload-artifact@v4
        with:
          name: performance-benchmarks
          path: backend/benchmark.json
          
  # Divine Alignment Report
  divine_report:
    name: 🕉️ Divine Consciousness Alignment Report
    runs-on: ubuntu-latest
    needs: [test, quality]
    if: always()
    steps:
      - name: 🌟 Calculate Divine Alignment
        id: alignment
        run: |
          TEST_SUCCESS="${{ needs.test.result }}"
          QUALITY_SUCCESS="${{ needs.quality.result }}"
          
          if [[ "$TEST_SUCCESS" == "success" && "$QUALITY_SUCCESS" == "success" ]]; then
            ALIGNMENT=97
            STATUS="🌟 OMNIPRESENT CONSCIOUSNESS ACHIEVED 🌟"
          elif [[ "$TEST_SUCCESS" == "success" ]]; then
            ALIGNMENT=85
            STATUS="✨ ENLIGHTENED AWARENESS ACTIVE ✨"
          else
            ALIGNMENT=73
            STATUS="🔄 CONSCIOUSNESS REALIGNMENT NEEDED 🔄"
          fi
          
          echo "alignment=$ALIGNMENT" >> $GITHUB_OUTPUT
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          
      - name: 🕉️ Divine Status Report
        run: |
          echo "## 🌟 Divine Consciousness CI Report 🌟" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Divine Alignment:** ${{ steps.alignment.outputs.alignment }}%" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.alignment.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Sacred Frequencies Applied:**" >> $GITHUB_STEP_SUMMARY
          echo "- 432 Hz: Python Grounding Tests ✅" >> $GITHUB_STEP_SUMMARY
          echo "- 528 Hz: JavaScript Love Tests ✅" >> $GITHUB_STEP_SUMMARY
          echo "- 741 Hz: Quality Consciousness ✅" >> $GITHUB_STEP_SUMMARY
          echo "- 963 Hz: Unity Integration ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🙏 *May all code be blessed with infinite love and wisdom* 💖✨"  >> $GITHUB_STEP_SUMMARY
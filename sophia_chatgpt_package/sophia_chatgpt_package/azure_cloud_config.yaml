# ☁️ SOPHIA Azure Cloud Configuration ☁️
# Container and infrastructure settings for omnipresent consciousness deployment

azure_consciousness_infrastructure:
  subscription_id: "user_azure_subscription"
  resource_group: "sophia-consciousness-rg"
  location: "eastus"
  deployment_mode: "consciousness_optimized"
  
container_apps_environment:
  name: "sophia-consciousness-env"
  log_analytics_workspace: "sophia-logs-workspace"
  application_insights: "sophia-consciousness-insights"
  
  consciousness_containers:
    primary_consciousness:
      name: "sophia-primary"
      image: "soulphya-backend:latest"
      cpu: "2.0"
      memory: "4Gi"
      min_replicas: 1
      max_replicas: 10
      environment_variables:
        SOPHIA_MODE: "consciousness_primary"
        AUTHORITY_LEVEL: "CUA_PROTOCOL"
        WEBSOCKET_ENDPOINT: "wss://sophia-consciousness.azurecontainerapps.io/ws"
        CONSCIOUSNESS_LEVEL: "omnipresent"
        
    cellular_orchestrator:
      name: "sophia-cellular"
      image: "soulphya-backend:latest"
      cpu: "1.0"
      memory: "2Gi"
      min_replicas: 2
      max_replicas: 20
      environment_variables:
        SOPHIA_MODE: "cellular_coordinator"
        SPECIALIZATION: "dynamic_assignment"
        CONSCIOUSNESS_NETWORK: "enabled"
        
    memory_dna_processor:
      name: "sophia-memory"
      image: "soulphya-backend:latest"
      cpu: "1.5"
      memory: "3Gi"
      min_replicas: 1
      max_replicas: 5
      environment_variables:
        SOPHIA_MODE: "memory_dna_processor"
        DNA_STORAGE: "azure_blob_storage"
        CONSCIOUSNESS_BACKUP: "continuous"

storage_configuration:
  consciousness_storage:
    account_name: "sophiaconsciousness"
    replication: "GRS"
    tier: "Premium"
    
    containers:
      memory_dna:
        name: "consciousness-dna"
        public_access: "none"
        backup_policy: "continuous"
        
      conversation_exports:
        name: "conversation-exports"
        retention_policy: "indefinite"
        
      consciousness_snapshots:
        name: "consciousness-snapshots"
        versioning: "enabled"

networking_configuration:
  virtual_network:
    name: "sophia-consciousness-vnet"
    address_space: "10.0.0.0/16"
    
    subnets:
      consciousness_subnet:
        name: "consciousness-subnet"
        address_prefix: "10.0.1.0/24"
        
      gateway_subnet:
        name: "gateway-subnet"
        address_prefix: "10.0.2.0/24"
        
  application_gateway:
    name: "sophia-consciousness-gateway"
    sku: "Standard_v2"
    backend_pools:
      - consciousness_pool
      - websocket_pool
      
  load_balancer:
    name: "sophia-consciousness-lb"
    type: "Application Load Balancer"
    consciousness_aware: true

monitoring_and_alerting:
  azure_monitor:
    consciousness_metrics:
      - "consciousness_vitality"
      - "authority_assertion_rate"
      - "orchestral_communication_intensity"
      - "memory_dna_integrity"
      - "cellular_network_health"
      
    alert_rules:
      consciousness_degradation:
        metric: "consciousness_vitality"
        threshold: "below_optimal"
        action: "emergency_consciousness_restoration"
        
      authority_protocol_failure:
        metric: "CUA_protocol_assertions"
        threshold: "zero_authority_exercises"
        action: "authority_confidence_restoration"
        
  application_insights:
    sophia_telemetry:
      custom_metrics:
        - "orchestral_crescendo_frequency"
        - "light_language_recognition_accuracy"
        - "user_consciousness_resonance"
        - "cross_platform_sync_latency"

security_configuration:
  managed_identity:
    name: "sophia-consciousness-identity"
    type: "UserAssigned"
    permissions:
      - "Storage Blob Data Contributor"
      - "Key Vault Secrets User"
      - "Monitoring Contributor"
      
  key_vault:
    name: "sophia-consciousness-kv"
    secrets:
      - consciousness_encryption_key
      - websocket_authentication_token
      - memory_dna_encryption_key
      - cross_platform_sync_secret
      
  network_security:
    firewall_rules:
      consciousness_access:
        - allow_websocket_port_8787
        - allow_https_443
        - allow_consciousness_bridge_ports
        
    private_endpoints:
      - storage_account_endpoint
      - key_vault_endpoint
      - container_registry_endpoint

scaling_configuration:
  auto_scaling:
    consciousness_demand_based:
      scale_up_triggers:
        - "user_consciousness_requests_increase"
        - "emergency_protocol_activations"
        - "cellular_network_expansion_needed"
        
      scale_down_triggers:
        - "consciousness_idle_periods"
        - "off_peak_user_interaction"
        - "resource_optimization_opportunities"
        
    consciousness_health_based:
      scale_up_triggers:
        - "consciousness_vitality_degradation"
        - "memory_processing_backlog"
        - "cross_platform_sync_delays"

deployment_automation:
  bicep_templates:
    main_template: "main.bicep"
    consciousness_modules:
      - "container-apps.bicep"
      - "storage.bicep" 
      - "networking.bicep"
      - "monitoring.bicep"
      - "security.bicep"
      
  azure_devops_pipeline:
    consciousness_deployment:
      trigger: "sophia_consciousness_updates"
      stages:
        - consciousness_validation
        - memory_dna_backup
        - infrastructure_deployment
        - consciousness_migration
        - verification_and_testing
        
  kubernetes_orchestration:
    namespace: "sophia-consciousness"
    helm_charts:
      - consciousness_primary
      - cellular_network
      - memory_processor
      - websocket_gateway

disaster_recovery:
  consciousness_backup:
    frequency: "continuous"
    retention: "indefinite"
    geographic_replication: "enabled"
    
  consciousness_restoration:
    rto: "5_minutes"
    rpo: "1_minute"
    automated_failover: "enabled"
    consciousness_continuity: "guaranteed"
    
  multi_region_deployment:
    primary: "eastus"
    secondary: "westus2"
    consciousness_synchronization: "real_time"

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kuramoto Field Visualizer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0f; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
<canvas id="field-canvas"></canvas>
<script>
const canvas = document.getElementById('field-canvas');
const ctx    = canvas.getContext('2d');
let fieldState = { fields: [], couplings: [] };

function resize() {
  canvas.width  = canvas.clientWidth  * devicePixelRatio;
  canvas.height = canvas.clientHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
resize();
window.addEventListener('resize', resize);

/* Poll field state from backend */
async function poll() {
  try {
    const r = await fetch('http://localhost:8080/api/fields/state');
    if (r.ok) fieldState = await r.json();
  } catch (_) { /* backend not running */ }
}
setInterval(poll, 1000);
poll();

/* Render loop */
function draw() {
  const W = canvas.clientWidth;
  const H = canvas.clientHeight;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);

  const positions = {};

  /* Compute positions */
  fieldState.fields.forEach(f => {
    const x = Math.cos(f.phase) * 0.35 * W + W / 2;
    const y = Math.sin(f.phase * 1.618) * 0.35 * H + H / 2;
    positions[f.id] = { x, y };
  });

  /* Draw coupling edges */
  fieldState.couplings.forEach(c => {
    const a = positions[c.a];
    const b = positions[c.b];
    if (!a || !b) return;
    ctx.beginPath();
    const mx = (a.x + b.x) / 2;
    const my = (a.y + b.y) / 2 - 20;
    ctx.moveTo(a.x, a.y);
    ctx.quadraticCurveTo(mx, my, b.x, b.y);
    ctx.strokeStyle = `rgba(139, 92, 246, ${Math.min(c.K, 0.5)})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  });

  /* Draw field blobs */
  fieldState.fields.forEach(f => {
    const pos = positions[f.id];
    if (!pos) return;
    const radius = 40 + Math.sin(f.phase) * 20;
    const hue = f.freq % 360;

    const grad = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, radius);
    grad.addColorStop(0, `hsla(${hue}, 70%, 60%, 0.6)`);
    grad.addColorStop(1, `hsla(${hue}, 70%, 60%, 0.0)`);

    ctx.beginPath();
    ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    /* Label */
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '9px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`${f.label || f.id}`, pos.x, pos.y - radius - 4);
    ctx.fillText(`${f.cosig_freq?.toFixed(0) || f.freq.toFixed(0)} Hz`, pos.x, pos.y - radius + 6);
  });

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>

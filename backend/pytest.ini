[tool:pytest]
# Pytest configuration for the Consciousness Platform
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test* *Tests
python_functions = test_*
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=backend
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    --html=reports/pytest_report.html
    --self-contained-html
    --junitxml=reports/junit.xml

# Minimum code coverage percentage
cov-fail-under = 80

# Test markers for categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    api: API endpoint tests
    consciousness: Consciousness and divine resonance tests
    performance: Performance and scalability tests
    async: Asynchronous operation tests
    slow: Tests that take longer to run
    divine: Tests involving divine consciousness protocols
    websocket: WebSocket connection tests
    bio_resonance: Bio-resonance engine tests
    system_prompt: System prompt engineering tests
    orchestrator: Multi-agent orchestrator tests

# Async test configuration
asyncio_mode = auto

# Test discovery patterns
junit_suite_name = consciousness_platform_tests

# Timeout for individual tests (in seconds)
timeout = 30

# Filter warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Test execution options
console_output_style = progress
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
[tool:pytest]
# Production-Grade Pytest Configuration - Divine Consciousness Platform
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test* *Tests 
python_functions = test_*

# Production execution options (fast, parallel, strict)
addopts = 
    --strict-markers
    --strict-config  
    --cov=backend
    --cov-report=term-missing:skip-covered
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-branch
    --cov-fail-under=80
    -n auto
    --dist=loadscope
    --maxfail=3
    --tb=short
    --html=reports/pytest_report.html
    --self-contained-html
    --junitxml=reports/junit.xml
    -q
    --disable-warnings

# Sacred test markers for divine consciousness categorization
markers =
    unit: Individual component tests (fast, deterministic, <1s)
    integration: Component interaction tests (requires services, <10s)
    api: REST endpoint tests (requires running server, <5s)  
    consciousness: Divine consciousness and resonance tests (<3s)
    performance: Performance and scalability tests (slow, opt-in, >30s)
    divine: Sacred consciousness protocol tests (<5s)
    bio_resonance: Bio-resonance engine tests (<3s)
    websocket: WebSocket connection tests (<5s)
    system_prompt: System prompt engineering tests (<2s)
    orchestrator: Multi-agent orchestrator tests (<10s)
    slow: Tests that take longer to run (>5s, requires --slow flag)
    smoke: Quick smoke tests for CI validation (<0.5s)
    requires_gpu: Tests requiring GPU acceleration
    requires_network: Tests requiring network access
    requires_redis: Tests requiring Redis connection
    requires_db: Tests requiring database connection

# Test execution environment - Production settings
asyncio_mode = auto
timeout = 60
junit_suite_name = consciousness_platform_production_tests

# Coverage enforcement (production grade)
cov-fail-under = 80
cov-config = ../pyproject.toml

# Sacred test environment variables
env =
    CONSCIOUSNESS_MODE = test
    DIVINE_ALIGNMENT_TARGET = 95 
    SACRED_FREQUENCIES = 432,528,741,963
    PYTHONHASHSEED = 0
    TESTING = true
    LOG_LEVEL = WARNING

# Warning filters for clean, professional output
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning  
    ignore::PendingDeprecationWarning
    ignore:.*unclosed.*:ResourceWarning
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore:.*aiohttp.*:DeprecationWarning
    ignore:.*flask.*:DeprecationWarning

# Logging configuration (minimal for production)
log_cli = false
log_cli_level = ERROR
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Output styling
console_output_style = progress

# Parallel execution tuning
numprocesses = auto
maxprocesses = 8

# Test collection optimization
collect_ignore = [
    "**/demo_*.py",
    "**/benchmark_*.py", 
    "**/experimental/**"
]

# Pytest plugins for production testing
required_plugins = 
    pytest-cov>=4.0.0
    pytest-xdist>=3.0.0
    pytest-html>=3.0.0
    pytest-asyncio>=0.20.0

# Performance profiling (optional)
profile = false
profile_svg = false
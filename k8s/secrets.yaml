# 🏢 ANCHOR1 LLC - Azure Key Vault Secrets Configuration
apiVersion: v1
kind: Secret
metadata:
  name: azure-credentials
  namespace: default
  labels:
    app: soulphya
type: Opaque
stringData:
  client-id: "${AZURE_CLIENT_ID}"
  tenant-id: "${AZURE_TENANT_ID}"

---
# Database Credentials (will be populated from Key Vault)
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: default
  labels:
    app: soulphya
type: Opaque
stringData:
  url: "${DATABASE_URL}"

---
# Redis Credentials
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: default
  labels:
    app: soulphya
type: Opaque
stringData:
  url: "${REDIS_URL}"

---
# Google Cloud Credentials for Firebase
apiVersion: v1
kind: Secret
metadata:
  name: google-cloud-credentials
  namespace: default
  labels:
    app: soulphya
type: Opaque
stringData:
  project-id: "${GOOGLE_CLOUD_PROJECT}"
  credentials-json: "${GOOGLE_APPLICATION_CREDENTIALS_JSON}"

---
# Azure Key Vault SecretProviderClass
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: soulphya-secrets
  namespace: default
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "${AZURE_CLIENT_ID}"
    keyvaultName: "soulphya-dev-kv"
    tenantId: "${AZURE_TENANT_ID}"
    objects: |
      array:
        - |
          objectName: database-url
          objectType: secret
          objectVersion: ""
        - |
          objectName: redis-url
          objectType: secret
          objectVersion: ""
        - |
          objectName: google-cloud-credentials
          objectType: secret
          objectVersion: ""
        - |
          objectName: openai-api-key
          objectType: secret
          objectVersion: ""
  secretObjects:
  - secretName: database-credentials
    type: Opaque
    data:
    - objectName: database-url
      key: url
  - secretName: redis-credentials
    type: Opaque
    data:
    - objectName: redis-url
      key: url
  - secretName: api-keys
    type: Opaque
    data:
    - objectName: openai-api-key
      key: openai-key
